# XRComm Playback v8T8R configuration — edit values, do not rename keys.
# The playback executable reads ALL startup parameters from this file and
# takes no console input. Text after '#' is a comment.
#
#   Missing key    -> the built-in default is used and printed at startup.
#   Malformed value-> the executable prints the offending key + accepted
#                     format and exits (no silent fallback).

# --- CPU cores: 5 required (main/stats, reader0, tx0, reader1, tx1) ---
core_list = 6,7,8,9,10

# --- Source: 0 = NVMe (SPDK, not in this build), 1 = file playback (.bin) ---
source_mode = 1

# --- Per-channel waveform files (resolved inside inputs/playback_waveforms/) ---
# Global CH0-3 = Port 0, CH4-7 = Port 1. Leave a value empty to disable that
# channel. Each channel may play a different waveform.
ch0_filename = tone_512.bin
ch1_filename = tone_512.bin
ch2_filename = tone_512.bin
ch3_filename = tone_512.bin
ch4_filename = tone_512.bin
ch5_filename = tone_512.bin
ch6_filename = tone_512.bin
ch7_filename = tone_512.bin

# --- Target sample rate (Hz) ---
target_sample_rate_hz = 1966080000

# --- TX port IDs (DPDK port enumeration is reversed: P0->1, P1->0) ---
port0_tx_port_id = 1
port1_tx_port_id = 0

# --- Destination MAC per port (eventually identical) ---
port0_dest_mac = 14:FE:B5:DD:9A:82
port1_dest_mac = 14:FE:B5:DD:9A:82

# --- Loop count (0 = infinite) ---
loop_count = 0

# --- Trigger burst size: placeholder in v8T8R (>=1). Runtime per-channel
#     't<CH>,<offset>' triggers are used instead; this key is not consumed. ---
trigger_burst_size = 1