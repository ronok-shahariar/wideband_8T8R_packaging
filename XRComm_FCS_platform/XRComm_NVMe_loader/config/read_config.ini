# =============================================================================
# XRComm NVMe read-back configuration
# -----------------------------------------------------------------------------
# Controls the automatic NVMe read-out that runs after a logging capture is
# stopped via a gRPC SetLogging(false) call (not on shutdown or failure).
#
# This file is OVERWRITTEN by the gRPC calls:
#     SetReadCapture(seconds)      -> updates read_duration_seconds
#     SetReadCaptureRate(hz)       -> updates sample_rate_hz
#
# The amount read out of the latest capture is:
#     bytes  = read_duration_seconds * sample_rate_hz * 4   (ComplexInt16 = 4 B)
#     records= round(bytes / 524288)   (524288 = 1024 data-LBA * 512 B/record)
# capped to the size of the latest capture.
# =============================================================================
[READBACK]
read_duration_seconds = 1
sample_rate_hz        = 800000000