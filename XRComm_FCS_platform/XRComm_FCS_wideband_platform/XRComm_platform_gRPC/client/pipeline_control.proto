// pipeline_control.proto  (v5)
// XRComm Platform Driver — gRPC control and monitoring service.
// Compiled with: protoc --grpc_out=. --cpp_out=. pipeline_control.proto

syntax = "proto3";
package xrcomm;
option go_package = "xrcomm/pipeline_control";

service PipelineControl {
  // Read current mode flags
  rpc GetFlags        (Empty)       returns (PipelineFlags);

  // Set individual flags (returns new state; modes are independent — no
  // mutual exclusion, any combination may be enabled simultaneously)
  rpc SetDspMode      (BoolRequest) returns (PipelineFlags);
  rpc SetLogging      (BoolRequest) returns (PipelineFlags);
  rpc SetIpMode       (BoolRequest) returns (PipelineFlags);

  // Graceful pipeline shutdown
  rpc Shutdown        (Empty)       returns (StatusReply);

  // Combined stats: pipeline + per-IP dispatch + DSP secondary + spectrum IPs
  rpc GetStats        (Empty)       returns (CombinedStats);

  // Per-API-mode stats: Rx / processed / drops for FULL_PACKET, IQ and
  // LOG_BLOCK modes, plus per external IP application.
  rpc GetModeStats    (Empty)       returns (ModeStats);

  // List all registered secondary IPs (in-process and out-of-process)
  rpc ListSecondaryIPs(Empty)       returns (SecondaryIPList);

  // 1 Hz streaming status
  rpc WatchStatus     (Empty)       returns (stream PipelineStatus);
}

message Empty {}
message BoolRequest { bool value = 1; }

message PipelineFlags {
  bool enable_dsp_mode = 1;
  bool enable_logging  = 2;
  bool enable_ip_mode  = 3;
  bool execute_rt_loop = 4;
}

message StatusReply { bool ok = 1; string error = 2; }

// Pipeline primary counters
message PipelineCounters {
  uint64 packets_received  = 1;
  uint64 packets_processed = 2;
  uint64 blocks_processed  = 3;
  uint64 blocks_logged     = 4;
  uint64 drops_no_mem      = 5;
  uint64 drops_ring_full   = 6;
}

// DSP secondary self-reported metrics (written by DSP IP to ctrl_shm)
message DspStats {
  bool   dsp_ready        = 1;
  uint64 epochs_processed = 2;
  uint64 epochs_dropped   = 3;
  uint64 peaks_detected   = 4;
  uint64 good_frames      = 5;
  uint64 bad_frames       = 6;
  float  last_cfo_hz      = 7;
  float  last_rssi        = 8;
  uint32 a2pj_write_index = 9;
  uint32 cfo_write_index  = 10;
  uint64 trigger_count    = 11;
}

// Per out-of-process IQ secondary dispatch stats (primary-side) + self-reported
message SpectrumIPStats {
  uint32 slot_id           = 1;
  string name              = 2;
  uint64 batches_pushed    = 3;  // primary dispatch counter
  uint64 batches_dropped   = 4;  // ring full
  uint64 samples_total     = 5;
  uint64 batches_received  = 6;  // self-reported by secondary
  uint64 batches_processed = 7;
  float  last_power_dbfs   = 8;
  float  mean_power_dbfs   = 9;
}

message CombinedStats {
  PipelineCounters  pipeline    = 1;
  DspStats          dsp         = 2;
  repeated SpectrumIPStats spectrum = 3;
  PlatformTelemetry platform_telemetry = 4;
}

// ── Platform-wide telemetry (packaging guide §8.2, Table A — wideband) ──────
// One set of values for the whole platform. Present in GetStats AND every
// WatchStatus update. packets_dropped = NIC RX overflow + application ring
// full, combined (monotonic since platform start).
message PlatformTelemetry {
  uint32 hsp_port                     = 1;  // NIC port id + 1 (port 0 -> 1)
  uint64 samples_received             = 2;  // total IQ samples received
  uint64 samples_logged              = 3;  // samples written to NVMe (0 if not logging)
  uint64 samples_processed_secondary  = 4;  // samples consumed by customer app(s)
  uint64 packets_dropped              = 5;  // RX overflow + app-ring-full, combined
}

message SecondaryIPEntry {
  uint32 slot_id    = 1;
  string name       = 2;
  int32  pid        = 3;
  string rx_mode    = 4;  // "FULL_PACKET", "IQ", or "LOG_BLOCK"
  bool   ring_ready = 5;
  bool   active     = 6;
  string process_type = 7;  // "dpdk_secondary" or "posix"
}

message SecondaryIPList {
  repeated SecondaryIPEntry entries = 1;
}

message PipelineStatus {
  PipelineFlags    flags    = 1;
  CombinedStats    stats    = 2;
  bool             running  = 3;
  uint64           uptime_ms = 4;
}

// ── Per-API-mode statistics (GetModeStats) ──────────────────────────────────
// One block per dispatch mode. rx = packets seen while the mode was enabled,
// processed = packets/blocks actually delivered to a consumer, drops = packets
// lost (ring full / no mem) on that mode's path.
message ApiModeCounters {
  string mode      = 1;  // "FULL_PACKET" | "IQ" | "LOG_BLOCK"
  uint64 rx        = 2;
  uint64 processed = 3;
  uint64 drops     = 4;
}

// Per external IP application (out-of-process IQ secondary) counters.
message AppModeCounters {
  uint32 slot_id   = 1;
  string name      = 2;
  string rx_mode   = 3;  // "IQ" (ZERO_COPY) or "FULL_PACKET"
  uint64 rx        = 4;  // batches pushed to this app by the primary
  uint64 processed = 5;  // batches the app reported processing
  uint64 drops     = 6;  // batches dropped (ring full) for this app
  bool   active    = 7;
}

message ModeStats {
  ApiModeCounters full_packet = 1;
  ApiModeCounters iq          = 2;
  ApiModeCounters log_block   = 3;
  repeated AppModeCounters apps = 4;
}
