# =============================================================================
# XRComm NVMe read-back configuration
# -----------------------------------------------------------------------------
# Controls the automatic NVMe read-out that runs after a logging capture is
# stopped via a gRPC SetLogging(false) call (not on shutdown or failure).
#
# This file is OVERWRITTEN by the gRPC calls:
#     SetReadCapture(seconds, start_offset_seconds)
#         -> updates read_duration_seconds and start_offset_seconds together
#     SetReadCaptureRate(hz)
#         -> updates sample_rate_hz
#
# start_offset_seconds is an OFFSET FROM THE START OF THE CAPTURE (not a wall
# clock time): 0.0 means "begin at the very first record of the capture".
#
# Both start_offset_seconds and read_duration_seconds are converted to whole
# NVMe records using sample_rate_hz, and ROUNDED DOWN (floor) to the nearest
# whole record:
#     start_records  = floor(start_offset_seconds  * sample_rate_hz * 4 / 524288)
#     duration_records = floor(read_duration_seconds * sample_rate_hz * 4 / 524288)
# (524288 = 1024 data-LBA * 512 B/record; 4 = bytes per ComplexInt16 sample.)
#
# If start_offset_seconds falls at or beyond the end of the capture, reading
# starts from the first record instead, and a warning is logged.
# If start_offset_seconds + read_duration_seconds exceeds the capture length,
# the read is capped to the remainder of the capture, and a warning is logged.
# =============================================================================
[READBACK]
start_offset_seconds  = 1.0
read_duration_seconds = 1.0
sample_rate_hz        = 1474560000